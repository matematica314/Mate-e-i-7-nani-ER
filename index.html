const KEY='bosco-matematico-v1';let saved;try{saved=JSON.parse(localStorage.getItem(KEY))}catch{}let state=saved&&Number.isInteger(saved.level)?saved:{level:0,runes:[],found:[],params:{}};state.level=Math.max(0,Math.min(6,state.level));state.runes||=[];state.runes=state.runes.map(x=>/^\d$/.test(String(x))?String(x):String(Math.floor(Math.random()*10)));state.found||=[];state.params||={};let zoom=1;

function load(){viewer.setImage(scenes[state.level][1]);if(state.level===1)viewer.lon=250}

const spots=[[],

 [{name:'Margherita ai piedi dell’abete',x:1.403,y:-.576,kind:'flower',show:()=>collect('fiore del bosco')},{name:'Bocca dell’abete',x:-.007,y:.483,kind:'mouth',show:()=>toast(state.found.includes('fiore del bosco')?'Trascina qui la margherita dalla borsa.':'L’abete aspetta una margherita: cercala ai suoi piedi.')},{name:'Funghi tra le radici',x:-.981,y:-.459,kind:'hidden',show:()=>modal('Indizio nascosto tra i funghi',`Accoppia il primo numero con l’ultimo: 1 + N, poi 2 + (N−1). Ogni coppia ha la stessa somma.`)},{name:'Funghi sul tronco caduto',x:2.277,y:-.862,kind:'hidden',show:()=>modal('Un altro indizio',`Le pigne sono 1 + 2 + … + N. Somma la sequenza in ordine crescente e in ordine decrescente: insieme ottieni N gruppi da N + 1; poi dividi per 2.`)}],

function drawSpots(){
 let root=document.querySelector('#hotspots'),list=spots[state.level];
 if(root.dataset.level!==String(state.level)||root.children.length!==list.length){root.replaceChildren();root.dataset.level=String(state.level);for(let h of list){let b=document.createElement('button');b.className='spot '+(h.kind||'');b.innerHTML=h.kind==='sign'?'<span class="sign-title">PER ATTRAVERSARE IL LAGO</span><span class="sign-copy">Serve una passerella da bordo a bordo, attraverso il centro.</span><span class="sign-cta">Scegli la domanda →</span>':(h.kind||'').includes('hidden')?'':h.kind==='mouth'||h.kind==='flower'?'':h.kind==='mission'?'✧':'✦';if(h.kind==='flower')b.onpointerdown=flowerDrag;b.title=h.name;b.setAttribute('aria-label',h.name);b.onclick=h.show;root.append(b)}}

  let pos=new THREE.Vector3(500*Math.cos(lat)*Math.cos(lon),500*Math.sin(lat),500*Math.cos(lat)*Math.sin(lon));
  let p=pos.project(viewer.camera),el=root.children[i];
  el.style.display=p.z<0||p.z>1||Math.abs(p.x)>1.15||Math.abs(p.y)>1.15?'none':h.kind==='sign'?'flex':'block';if(h.kind==='sign')el.style.setProperty('--sign-scale',Math.max(.82,Math.min(1.65,75/viewer.fov)).toFixed(2));
  el.style.left=(p.x+1)*50+'%';el.style.top=(1-p.y)*50+'%';

 })
}
function setZoom(z){zoom=Math.max(1,Math.min(2.5,z));viewer.fov=Math.max(30,Math.min(100,75/zoom));viewer.camera.fov=viewer.fov;viewer.camera.updateProjectionMatrix();drawSpots()}
function inventory(){let root=document.querySelector('#inventory');root.replaceChildren();for(let item of state.found){let b=document.createElement('button');b.textContent=item==='fiore del bosco'?'🌼 Margherita':item==='pergamena'?'📜 Ricetta':item==='luna'?'🌙 Luna':item==='argento'?'🥈 Argento':'🌸 Fiore';b.onclick=()=>item==='pergamena'?recipe():item==='fiore del bosco'?toast('Trascina la margherita sulla bocca dell’abete.'):toast('Ingrediente raccolto: '+item);if(item==='fiore del bosco')b.onpointerdown=flowerDrag;root.append(b)}}
function awakenTree(){if(!state.found.includes('fiore del bosco'))state.found.push('fiore del bosco');state.params[2].awake=true;save();inventory();modal('L’abete si risveglia',`«Bene, ora ascolta: sul primo ramo ho ${params().n} pigne; sul secondo ${params().n-1}, e così via fino all’ultimo ramo con una sola pigna. Quante pigne ho in tutto?» <div class="row"><button onclick="closeModal();action()">Rispondi</button></div>`)}
function flowerDrag(e){if(state.level!==2)return;e.stopPropagation();let startX=e.clientX,startY=e.clientY,ghost=null,moved=false;
 const move=q=>{if(!moved&&Math.hypot(q.clientX-startX,q.clientY-startY)>9){moved=true;ghost=document.createElement('div');ghost.className='dragging';ghost.textContent='🌼';document.body.append(ghost)}if(ghost){ghost.style.left=q.clientX+'px';ghost.style.top=q.clientY+'px'}},up=q=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);if(!moved)return;ghost?.remove();let target=document.elementFromPoint(q.clientX,q.clientY);if(target?.closest('.spot.mouth'))awakenTree();else{if(!state.found.includes('fiore del bosco')){state.found.push('fiore del bosco');save();inventory()}toast('Margherita raccolta: trascinala dalla borsa alla bocca dell’abete.')}};

function recipe(){let p=params();modal('La pergamena dell’invisibilità',`<p>Per sfuggire ai lupi mannari sotto la luna piena, <strong>ogni persona</strong> dovrà assumere una dose della pozione dell’invisibilità: <strong>${p.a} gocce di luna, ${p.b} misure d’argento e ${p.c} petali del fiore notturno.</strong></p><p>Prepara in una sola volta la quantità necessaria per tutti e otto: dopo ogni preparazione il calderone è inutilizzabile per 12 ore.</p><p>Ingredienti trovati: ${state.found.filter(x=>['luna','argento','fiore'].includes(x)).length} su 3.</p>`)}

function page(){let s=scenes[state.level];document.querySelector('#scene').textContent=s[0];document.querySelector('#progress').textContent=(state.level+1)+'/7 · Rune: '+state.runes.length+'/5';document.querySelector('#note').textContent=s[2];document.querySelector('#action').textContent=s[3];document.querySelector('#action').hidden=[1,3,6].includes(state.level);params();zoom=1;document.querySelector('#resumeBtn').hidden=!(state.level===0&&state.resume>0);load();drawSpots();inventory();save()}

function number(id){let raw=document.getElementById(id)?.value.trim();if(!raw)return NaN;let v=Number(raw.replace(',','.'));return Number.isFinite(v)?v:NaN}function check(target,msg){let v=number('answer');if(Math.abs(v-target)<.015)win();else if(state.level===2){closeModal();pinefall();setTimeout(()=>fail('Le pigne vi hanno travolto! Riprova la somma.'),1400)}else if(state.level===3)wallFailure();else fail(msg)}
function action(){let p=params();switch(state.level){case 0:modal('La missione comincia','<video id="intro" controls playsinline preload="metadata" style="width:100%;max-height:55vh;border-radius:12px;background:black" src="intro.mp4"></video><p>Mate e i sette nani si preparano a entrare nel Bosco Matematico.</p><div class="row"><button onclick="next()">Inizia la missione</button></div>');document.querySelector('#modal').classList.add('intro');document.querySelector('#intro').play().catch(()=>{});break;
case 1:readLakeSign();break;
case 2:if(!p.awake){toast('Cerca il fiore nella scena e trascinalo sulla bocca dell’abete.');return}modal('L’albero delle pigne',`Dal ramo con ${p.n} pigne fino a quello con 1, scendendo di una pigna alla volta: quante pigne in tutto?<input id="answer" type="number" inputmode="numeric"><button onclick="check(${p.n}*(${p.n}+1)/2,'Una cascata di pigne vi riporta ai piedi dell’albero!')">Conferma</button>`);break;
case 3:if(!p.seen){wallMission();return}modal('Il muro e le ombre',`Altezza ${p.who===1.5?'di Mate':'di un nano'}: ${p.who} m. Ombra: ${p.shadow} m. Ombra del muro: ${p.wallShadow} m. Quanto è alto il muro, in metri?<input id="answer" type="text" inputmode="decimal"><button onclick="check(${p.who*p.wallShadow/p.shadow},'La scala non raggiunge la cima: tornate a misurare le ombre.')">Conferma</button>`);break;
case 4:if(!['pergamena','luna','argento','fiore'].every(x=>state.found.includes(x))){toast('Esplora: servono la pergamena e tutti e tre gli ingredienti.');return}modal('La pozione per otto',`Dalla pergamena: una dose contiene ${p.a} gocce di luna, ${p.b} misure d’argento e ${p.c} petali. Il calderone funziona una sola volta: inserisci le quantità complessive per Mate e i sette nani.<label>Luna<input id="l" type="number" inputmode="numeric"></label><label>Argento<input id="a" type="number" inputmode="numeric"></label><label>Petali<input id="f" type="number" inputmode="numeric"></label><button onclick="potion()">Prepara</button>`);break;
case 5:modal('Il ponte delle pietre',`Il burrone separa il gruppo dal castello. Solo le pietre con i numeri corretti reggeranno. Le prime quattro riportano ${p.start}, ${p.start+p.step}, ${p.start+2*p.step}, ${p.start+3*p.step}. Digita i numeri delle TRE pietre successive, separati da virgole.<input id="seq" type="text" inputmode="text" placeholder="es. 10, 12, 14"><button onclick="bridge()">Attraversa</button>`);break;
case 6:gateMission();break}}
function readLakeSign(){let p=params();modal('Il cartello sulla riva',`<p>Per raggiungere il sentiero sull’altra riva, la passerella deve andare esattamente da un bordo all’altro del lago circolare, passando per il centro. Se è troppo corta, cadrete nell’acqua; se è troppo lunga, arriverete alla sponda infuocata.</p><p>Potete fare <strong>una sola domanda</strong> per trovare la lunghezza giusta.</p><div class="row"><button onclick="chooseLakeQuestion()">${p.ask?'Rivedi la misura scelta':'Scegli la domanda'}</button></div>`)}function chooseLakeQuestion(){let p=params();if(p.ask){lakeForm();return}modal('Quale misura vuoi conoscere?','<p>Puoi chiedere soltanto una di queste tre misure.</p><div class="row"><button onclick="askLake(\'area\')">Area del lago</button><button onclick="askLake(\'circ\')">Circonferenza</button><button onclick="askLake(\'arc\')">Lunghezza di un arco</button></div>')}function gcd(a,b){while(b)[a,b]=[b,a%b];return a}function fraction(a,b){let g=gcd(a,b);a/=g;b/=g;return b===1?String(a):a+'/'+b}function askLake(type){let p=params();if(type==='arc')p.d=(360/p.angle)*rand([1,2]);p.ask=type;save();lakeForm()}function lakeForm(){let p=params();if(p.ask==='arc'&&(p.d*p.angle)%360!==0){p.d=360/p.angle;save()}let d=p.d;let data=p.ask==='area'?`Area = ${d*d/4}π m²`:p.ask==='circ'?`Circonferenza = ${d}π m`:`Arco di ${p.angle}° = ${d*p.angle/360}π m`;modal('La passerella',`L’unica risposta ricevuta è: <strong>${data}</strong>. Qual è la lunghezza esatta della passerella, in metri? Inserisci la lunghezza in metri.<input id="answer" type="text" inputmode="decimal"><button onclick="lakeCheck()">Posa la passerella</button>`)}function lakeCheck(){let v=number('answer'),d=params().d;if(Math.abs(v-d)<.015)win();else fail(v<d?'La passerella è troppo corta: tutti finiscono nell’acqua del lago!':'La passerella supera la riva e conduce verso il fuoco!')}
function potion(){let p=params();if(number('l')===8*p.a&&number('a')===8*p.b&&number('f')===8*p.c)win();else fail('La pozione diventa fluorescente: i licantropi vi scoprono!')}function bridge(){let p=params(),v=document.querySelector('#seq').value.split(/[,;\s]+/).filter(Boolean).map(Number);if(v.length===3&&v.every((x,i)=>x===p.start+(i+4)*p.step))win();else fail('Una pietra si sgretola: tornate all’inizio del ponte.')}function wallMission(){if(viewer.fov>60){toast('Ingrandisci il portone per leggere l’iscrizione.');return}params().seen=true;save();let p=params();modal('L’iscrizione sul portone',`<p>«Al di là del muro passa soltanto chi sa costruire la scala giusta. Troppo corta: cadrai; troppo lunga: tornerai indietro.»</p><p>Quanto deve essere alta la scala? ${p.who===1.5?'Mate è alta 1,50 m':'Un nano è alto 1,20 m'} e la sua ombra misura ${p.shadow} m. L’ombra del muro misura ${p.wallShadow} m. Cerca indizi nelle ombre del pozzo e della panchina.</p><div class="row"><button onclick="action()">Calcola la scala</button></div>`)}
function wallFailure(){state.level=2;state.runes.pop();state.found=['fiore del bosco'];save();page();modal('La scala cede',`La misura è sbagliata: Mate e i nani sono tornati davanti all’abete. La cifra dell’albero va conquistata di nuovo.<div class="row"><button onclick="closeModal()">Torna all’abete</button></div>`)}
function potionMission(){modal('La tana sotto la luna piena',`<p>Fuori risuonano gli ululati: i lupi mannari stanno arrivando. Solo la pozione dell’invisibilità potrà far passare Mate e i sette nani senza essere visti.</p><p>Trova la pergamena accanto alla candela, l’essenza sulla luna, l’argento fra i gioielli e i petali sui fiori celesti. Poi prepara tutte e otto le dosi nel calderone.</p><div class="row"><button onclick="closeModal();action()">Prepara la pozione</button></div>`)}
function bridgeMission(){let p=params();modal('La missione del burrone',`<p>Davanti a voi, il ponte è scomparso. Solo una successione di pietre sospese può condurvi al castello: scegliendo il numero sbagliato, la pietra si sgretola.</p><p>Le prime pietre portano ${p.start}, ${p.start+p.step}, ${p.start+2*p.step}, ${p.start+3*p.step}. Quali saranno i numeri delle tre successive?</p><div class="row"><button onclick="action()">Scegli le pietre</button></div>`)}
function gateMission(){modal('La serratura del portone',`<p>«Cinque prove, cinque cifre. Nell’ordine in cui le avete vinte, componetele: soltanto così Biancaneve sarà libera.»</p><p>Le cifre annotate durante il viaggio sono: <strong>${state.runes.join(' · ')||'nessuna'}</strong></p><input id="code" type="text" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="Codice di cinque cifre"><button onclick="gate()">Apri il portone</button>`)}
function gate(){let v=document.querySelector('#code')?.value.trim();if(state.runes.length===5&&/^\d{5}$/.test(v)&&v===state.runes.join('')){state.completed=true;save();victory()}else toast('Le cinque cifre devono seguire l’ordine delle missioni.');}
function victory(){closeModal();document.querySelector('#victory').classList.add('open')}
document.querySelector('#action').onclick=action;document.querySelector('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};page();
</script></html>
