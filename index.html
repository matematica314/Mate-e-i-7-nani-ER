<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mate e i sette nani · Bosco matematico</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101b2d;color:white;font:16px system-ui}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}header{position:fixed;top:0;left:0;right:0;padding:12px 16px;background:linear-gradient(#102036d9,transparent);display:flex;justify-content:space-between;gap:10px;align-items:center}button{cursor:pointer;border:0;border-radius:14px;padding:11px 15px;font-weight:700;color:#112038;background:#ffe1a0}button:disabled{opacity:.45}#hud{font-size:13px}#scene{font-weight:800}#hotspots{position:fixed;inset:0;pointer-events:none}.spot{position:absolute;transform:translate(-50%,-50%);width:48px;height:48px;border:2px solid #fff9;border-radius:50%;background:#fff3;box-shadow:0 0 20px #fff8;pointer-events:auto;color:white;font-size:22px;padding:0}.spot:hover,.spot:focus-visible{background:#ffcb64}#bottom{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;align-items:end;justify-content:center;padding:16px;background:linear-gradient(transparent,#102036d9)}#note{max-width:630px;background:#102036dc;padding:12px;border-radius:14px;font-size:14px}#modal{position:fixed;inset:0;display:none;place-items:center;background:#071525bd;padding:16px}#modal.open{display:grid}.card{background:#f9f2dd;color:#192638;border-radius:22px;padding:22px;max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 80px #0009}.card h2{margin-top:0}.card input{width:100%;padding:13px;margin:8px 0 14px;font-size:19px;border-radius:10px;border:1px solid #9aa}.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.card button{background:#173c57;color:white}.card .secondary{background:#ddd;color:#213}.small{font-size:14px;color:#394954}#toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);background:#192c43;padding:12px 18px;border-radius:16px;display:none;max-width:92vw;text-align:center}#progress{position:fixed;top:51px;right:12px;font-size:12px}@media(max-width:600px){header{align-items:start}#hud{max-width:190px;text-align:right}#bottom{flex-wrap:wrap}#note{width:100%}.spot{width:42px;height:42px}}</style>
<canvas id="view"></canvas><div id="hotspots"></div><header><div><div id="scene"></div><div id="progress"></div></div><div id="hud">Trascina per guardarti intorno · tocca i bagliori</div></header><div id="toast"></div><div id="bottom"><div id="note"></div><button id="action">Continua</button></div><div id="modal"><div class="card" id="card"></div></div>
<script>
const scenes=[['La radura','01-radura.webp','Mate incontra i sette nani. Biancaneve è prigioniera oltre il Bosco Matematico.','Inizia la missione'],['Il lago incantato','02-lago.webp','La passerella deve misurare esattamente il diametro del lago. Hai diritto a una sola domanda.','Scegli la domanda'],['L’albero di Gauss','03-abete.webp','L’abete conta N pigne sul primo ramo, N−1 sul secondo, fino a una sola pigna.','Rispondi'],['Il muro di Talete','04-muro.webp','Le ombre possono rivelare l’altezza del muro.','Rispondi'],['La tana dei licantropi','05-tana.webp','Trova la pergamena e i tre ingredienti nel panorama; poi prepara otto dosi.','Apri il calderone'],['Il ponte delle pietre','06-ponte.webp','Scopri la regola e scegli le tre pietre successive.','Attraversa'],['Il portone di Biancaneve','07-castello.webp','Le cinque rune raccolte nel viaggio aprono il portone.','Apri il portone']];
const sources=[['exec-2320d075-6bbf-4316-a406-fb3386fff519.png','01-radura.webp'],['exec-6d008de7-eb95-44a7-8fbe-f339d7d8535d.png','02-lago.webp'],['exec-b0ea32f9-404a-4e2c-9de6-8302fe164413.png','03-abete.webp'],['exec-465790d1-9693-47ca-be7c-bcec9768028d.png','04-muro.webp'],['exec-e77aa670-c683-431b-8656-774cef8eaceb.png','05-tana.webp'],['exec-7c35ec59-5a11-4cbb-b454-e4bf8d5b96d0.png','06-ponte.webp'],['exec-a533c482-7c49-4025-b7ca-bfe56d4ddb52.png','07-castello.webp']];
const KEY='bosco-matematico-v1';let saved;try{saved=JSON.parse(localStorage.getItem(KEY))}catch{}let state=saved&&Number.isInteger(saved.level)?saved:{level:0,runes:[],found:[],params:{}};let yaw=0,pitch=0,drag=null,texture=null,currentImage=null;
const cv=document.querySelector('#view'),gl=cv.getContext('webgl',{antialias:false,alpha:false});if(!gl)alert('Il dispositivo non supporta WebGL. Prova un browser aggiornato.');
const vs=`attribute vec2 p; varying vec2 uv; void main(){uv=p;gl_Position=vec4(p,0.,1.);}`;
const fs=`precision mediump float;varying vec2 uv;uniform sampler2D pano;uniform vec2 resolution;uniform float yaw,pitch;const float PI=3.14159265359;void main(){vec2 q=(uv*2.-1.);q.x*=resolution.x/resolution.y;vec3 d=normalize(vec3(q.x,-q.y,1.25));float c=cos(pitch),s=sin(pitch);d=vec3(d.x,d.y*c+d.z*s,-d.y*s+d.z*c);c=cos(yaw);s=sin(yaw);d=vec3(d.x*c+d.z*s,d.y,-d.x*s+d.z*c);vec2 t=vec2(atan(-d.x,d.z)/(2.*PI)+.5,acos(clamp(d.y,-1.,1.))/PI);gl_FragColor=texture2D(pano,t);}`;
function shader(t,s){let x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x}let prog;if(gl){prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);gl.useProgram(prog);let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);let a=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0)}
function resize(){let scale=Math.min(devicePixelRatio||1,1.5);cv.width=innerWidth*scale;cv.height=innerHeight*scale;gl?.viewport(0,0,cv.width,cv.height);render()};addEventListener('resize',resize);
function render(){if(!gl||!texture)return;gl.useProgram(prog);gl.uniform2f(gl.getUniformLocation(prog,'resolution'),cv.width,cv.height);gl.uniform1f(gl.getUniformLocation(prog,'yaw'),yaw);gl.uniform1f(gl.getUniformLocation(prog,'pitch'),pitch);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);drawSpots()}
function image(path){return new Promise((ok,no)=>{let im=new Image;im.onload=()=>ok(im);im.onerror=no;im.src=path})}async function load(){try{let im=await image(scenes[state.level][1]);currentImage=im;if(texture)gl.deleteTexture(texture);texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);render()}catch(e){toast('Immagine mancante: '+scenes[state.level][1])}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function rand(a){return a[Math.floor(Math.random()*a.length)]}function params(){if(state.params[state.level])return state.params[state.level];let p;switch(state.level){case 1:p={d:rand([8,10,12,16,20]),angle:rand([12,15,20,24,30,36,40,45,60,72,90,120])};break;case 2:p={n:rand([99,399,599,999])};break;case 3:p={who:rand([1.2,1.5]),shadow:rand([1.2,1.5,2]),wallShadow:rand([6,8,10])};break;case 4:p={a:rand([2,3,4]),b:rand([2,3]),c:rand([3,4,5])};break;case 5:p={start:rand([2,3,4]),step:rand([2,3,4])};break;default:p={}}state.params[state.level]=p;save();return p}
const spots=[[],[{name:'Indizio sul cerchio',x:0,y:0,show:()=>modal('Indizio',`Il diametro è due volte il raggio. Circonferenza = π × diametro; area = π × raggio²; arco = circonferenza × angolo / 360.`)}],[{name:'Coppie di Gauss',x:0,y:0,show:()=>modal('Tra le radici',`Accoppia il primo numero con l’ultimo: 1 + N, poi 2 + (N−1). Ogni coppia ha la stessa somma.`)}],[{name:'Stele di Talete',x:0,y:0,show:()=>modal('L’indizio di Talete',`Con il Sole nella stessa posizione, altezza e ombra sono proporzionali: altezza del muro / ombra del muro = altezza del viaggiatore / sua ombra.`)}],[{name:'Pergamena',x:0,y:0,show:()=>collect('pergamena')},{name:'Essenza di luna',x:-1.15,y:.25,show:()=>collect('luna')},{name:'Polvere d’argento',x:1.05,y:-.1,show:()=>collect('argento')},{name:'Fiore notturno',x:2.2,y:-.2,show:()=>collect('fiore')}],[{name:'Segni sulle pietre',x:0,y:0,show:()=>modal('Indizio',`Confronta due pietre consecutive. Quanto aumenta ogni volta?`)}],[]];
function drawSpots(){let root=document.querySelector('#hotspots');root.innerHTML='';for(let h of spots[state.level]){let angle=Math.atan2(Math.sin(h.x-yaw),Math.cos(h.x-yaw));let v=h.y-pitch;let f=1.25;let xx=Math.tan(angle)*f,yy=Math.tan(v)*f;if(Math.abs(angle)>1.05||Math.abs(v)>0.7)continue;let b=document.createElement('button');b.className='spot';b.style.left=(50+xx*50*innerHeight/innerWidth)+'%';b.style.top=(50-yy*50)+'%';b.textContent=state.found.includes(h.name.toLowerCase())?'✓':'✦';b.title=h.name;b.setAttribute('aria-label',h.name);b.onclick=h.show;root.append(b)}}
cv.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY,yaw,pitch];cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!drag)return;yaw=drag[2]-(e.clientX-drag[0])/Math.min(innerWidth,innerHeight)*1.9;pitch=Math.max(-1.25,Math.min(1.25,drag[3]+(e.clientY-drag[1])/Math.min(innerWidth,innerHeight)*1.9));render()});cv.addEventListener('pointerup',()=>drag=null);cv.addEventListener('wheel',e=>{pitch=Math.max(-1.25,Math.min(1.25,pitch+e.deltaY*.001));render()},{passive:true});
function toast(t){let el=document.querySelector('#toast');el.textContent=t;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',3400)}function modal(title,html){document.querySelector('#card').innerHTML='<h2>'+title+'</h2>'+html+'<div class="row"><button class="secondary" onclick="closeModal()">Chiudi</button></div>';document.querySelector('#modal').classList.add('open')}function closeModal(){document.querySelector('#modal').classList.remove('open')}function collect(item){if(!state.found.includes(item))state.found.push(item);save();modal('Oggetto trovato','Hai raccolto: <strong>'+item+'</strong>. '+(item==='pergamena'?'La ricetta sulla pergamena indica le quantità per UNA persona.':''));render()}
function page(){let s=scenes[state.level];document.querySelector('#scene').textContent=s[0];document.querySelector('#progress').textContent=(state.level+1)+'/7 · Rune: '+state.runes.length+'/5';document.querySelector('#note').textContent=s[2];document.querySelector('#action').textContent=s[3];params();yaw=0;pitch=0;load();drawSpots();save()}
function next(){closeModal();if(state.level<6){state.level++;state.found=[];page()}else{modal('Biancaneve è libera!','Mate e i sette nani hanno attraversato il Bosco Matematico insieme. <div class="row"><button onclick="restart()">Ricomincia con nuovi numeri</button></div>')}}function restart(){state={level:0,runes:[],found:[],params:{}};page();closeModal()}
function win(){const rune=['🌊','🌲','☀️','🧪','🌉'][state.level-1];state.runes.push(rune);save();modal('Prova superata!',`Avete conquistato la runa ${rune}. <div class="row"><button onclick="next()">Prosegui</button></div>`)}function fail(msg){modal('La tappa ricomincia',msg+' <p class="small">Il percorso precedente resta salvato. Potete cercare un indizio e riprovare.</p>')}
function number(id){let v=Number(document.getElementById(id)?.value.replace(',','.'));return Number.isFinite(v)?v:NaN}function check(target,msg){let v=number('answer');if(Math.abs(v-target)<.015)win();else fail(msg)}
function action(){let p=params();switch(state.level){case 0:modal('Il prologo','<p>🎬 Spazio predisposto per il video iniziale. Il filmato definitivo potrà essere inserito come <code>video/prologo.mp4</code> davanti alla radura.</p><p>Mate: «Non diamoci per vinti. Proviamo!»</p><div class="row"><button onclick="next()">Inizia la missione</button></div>');break;
case 1: {let ask=state.params[1].ask;if(!ask){modal('Una sola domanda','<p>Scegli quale misura conoscere. Le altre due non saranno più disponibili.</p><div class="row"><button onclick="askLake(\'area\')">Area</button><button onclick="askLake(\'circ\')">Circonferenza</button><button onclick="askLake(\'arc\')">Arco</button></div>')}else lakeForm();break}
case 2:modal('L’albero delle pigne',`Dal ramo con ${p.n} pigne fino a quello con 1, scendendo di una pigna alla volta: quante pigne in tutto?<input id="answer" type="number" inputmode="numeric"><button onclick="check(${p.n}*(${p.n}+1)/2,'Una cascata di pigne vi riporta ai piedi dell’albero!')">Conferma</button>`);break;
case 3:modal('Il muro e le ombre',`Altezza ${p.who===1.5?'di Mate':'di un nano'}: ${p.who} m. Ombra: ${p.shadow} m. Ombra del muro: ${p.wallShadow} m. Quanto è alto il muro, in metri?<input id="answer" type="text" inputmode="decimal"><button onclick="check(${p.who*p.wallShadow/p.shadow},'La scala non raggiunge la cima: tornate a misurare le ombre.')">Conferma</button>`);break;
case 4:if(!['pergamena','luna','argento','fiore'].every(x=>state.found.includes(x))){toast('Esplora: servono la pergamena e tutti e tre gli ingredienti.');return}modal('La pozione per otto',`La pergamena dà la dose per UNA persona: ${p.a} gocce di luna, ${p.b} misure d’argento, ${p.c} petali. Inserisci le quantità per Mate e i sette nani.<label>Luna<input id="l" type="number" inputmode="numeric"></label><label>Argento<input id="a" type="number" inputmode="numeric"></label><label>Petali<input id="f" type="number" inputmode="numeric"></label><button onclick="potion()">Prepara</button>`);break;
case 5:modal('Il ponte delle pietre',`Le prime pietre riportano ${p.start}, ${p.start+p.step}, ${p.start+2*p.step}, ${p.start+3*p.step}. Digita i numeri delle TRE pietre successive, separati da virgole.<input id="seq" type="text" inputmode="text" placeholder="es. 10, 12, 14"><button onclick="bridge()">Attraversa</button>`);break;
case 6:modal('Il portone magico',`<p>«Nell’ordine del viaggio, le rune dovete disporre; dal lago al ponte il varco si può aprire.»</p><p>Rune raccolte: ${state.runes.join(' ')}</p><p>Inserisci le iniziali dei luoghi nell’ordine attraversato: Lago, Albero, Muro, Tana, Ponte.</p><input id="code" maxlength="5" autocapitalize="characters" placeholder="Cinque lettere"><button onclick="gate()">Apri</button>`);break}}
function askLake(type){let p=params();p.ask=type;save();lakeForm()}function lakeForm(){let p=params(),d=p.d;let data=p.ask==='area'?`Area = ${d*d/4}π m²`:p.ask==='circ'?`Circonferenza = ${d}π m`:`Arco di ${p.angle}° = ${d*p.angle/360}π m`;modal('La passerella',`L’unica risposta ricevuta è: <strong>${data}</strong>. Qual è la lunghezza esatta della passerella, in metri? Inserisci un numero senza π.<input id="answer" type="text" inputmode="decimal"><button onclick="lakeCheck()">Posa la passerella</button>`)}function lakeCheck(){let v=number('answer'),d=params().d;if(Math.abs(v-d)<.015)win();else fail(v<d?'La passerella è troppo corta: tutti finiscono nell’acqua del lago!':'La passerella supera la riva e conduce verso il fuoco!')}
function potion(){let p=params();if(number('l')===8*p.a&&number('a')===8*p.b&&number('f')===8*p.c)win();else fail('La pozione diventa fluorescente: i licantropi vi scoprono!')}function bridge(){let p=params(),v=document.querySelector('#seq').value.split(/[,;\s]+/).filter(Boolean).map(Number);if(v.length===3&&v.every((x,i)=>x===p.start+(i+4)*p.step))win();else fail('Una pietra si sgretola: tornate all’inizio del ponte.')}function gate(){if(document.querySelector('#code').value.trim().toUpperCase()==='LAMTP')next();else toast('Osserva l’ordine delle cinque tappe dopo la radura.')}
document.querySelector('#action').onclick=action;document.querySelector('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};resize();page();
</script></html>
