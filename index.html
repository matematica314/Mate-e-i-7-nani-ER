<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mate e i sette nani · Bosco matematico</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101b2d;color:white;font:16px system-ui}#panorama-container{position:fixed;inset:0;touch-action:none;background:#101b2d;cursor:grab}#panorama-container canvas{display:block;width:100%;height:100%}header{position:fixed;top:0;left:0;right:0;padding:12px 16px;background:linear-gradient(#102036d9,transparent);display:flex;justify-content:space-between;gap:10px;align-items:center}button{cursor:pointer;border:0;border-radius:14px;padding:11px 15px;font-weight:700;color:#112038;background:#ffe1a0}button:disabled{opacity:.45}#hud{font-size:13px;display:flex;gap:6px;align-items:center}.nav{padding:7px 9px;font-size:12px;background:#ffffffd9}#scene{font-weight:800}#hotspots{position:fixed;inset:0;pointer-events:none}.spot{position:absolute;transform:translate(-50%,-50%);width:48px;height:48px;border:2px solid #fff9;border-radius:50%;background:#fff3;box-shadow:0 0 20px #fff8;pointer-events:auto;color:white;font-size:22px;padding:0}.spot:hover,.spot:focus-visible{background:#ffcb64}#zoomctl{position:fixed;right:12px;top:96px;display:grid;gap:7px}#zoomctl button{font-size:22px;width:42px;height:42px;padding:0}#inventory{position:fixed;left:12px;top:75px;display:flex;gap:6px;flex-wrap:wrap;max-width:60vw}#inventory button{font-size:14px;padding:8px;background:#f4e4b8}#effects{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:8}.fall{position:absolute;top:-12vh;font-size:35px;animation:fall 1.55s ease-in forwards}@keyframes fall{to{transform:translate(var(--dx),115vh) rotate(720deg)}}.shake{animation:shake .65s 2}@keyframes shake{25%{transform:translate(8px,9px)}50%{transform:translate(-9px,-5px)}75%{transform:translate(7px,-7px)}}.spot{opacity:.6}.spot:hover,.spot:focus-visible{opacity:1} .spot.sign{width:76px;height:48px;border-radius:6px;background:#8b5b2b;color:#fff;font-size:13px;opacity:.9}.spot.mouth{border-color:#ffe29c;background:#6c3a1b99}.dragging{position:fixed;z-index:20;pointer-events:none;transform:translate(-50%,-50%);font-size:34px}#bottom{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;align-items:end;justify-content:center;padding:16px;background:linear-gradient(transparent,#102036d9)}#note{max-width:630px;background:#102036dc;padding:12px;border-radius:14px;font-size:14px}#modal{position:fixed;inset:0;display:none;place-items:center;background:#071525bd;padding:16px}#modal.open{display:grid}.card{background:#f9f2dd;color:#192638;border-radius:22px;padding:22px;max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 80px #0009}.card h2{margin-top:0}.card input{width:100%;padding:13px;margin:8px 0 14px;font-size:19px;border-radius:10px;border:1px solid #9aa}.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.card button{background:#173c57;color:white}.card .secondary{background:#ddd;color:#213}.small{font-size:14px;color:#394954}#toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);background:#192c43;padding:12px 18px;border-radius:16px;display:none;max-width:92vw;text-align:center}#progress{position:fixed;top:51px;right:12px;font-size:12px}@media(max-width:600px){header{align-items:start}#hud{max-width:190px;text-align:right}#bottom{flex-wrap:wrap}#note{width:100%}.spot{width:42px;height:42px}}</style>
<div id="panorama-container"></div><div id="hotspots"></div><header><div><div id="scene"></div><div id="progress"></div></div><div id="hud"><button class="nav" onclick="home()">⌂ Radura</button><button class="nav" onclick="resume()" id="resumeBtn" hidden>▶ Riprendi</button><button class="nav" onclick="restart()">↺ Ricomincia</button></div></header><div id="toast"></div><div id="effects"></div><div id="zoomctl"><button type="button" onclick="setZoom(zoom+.45)" aria-label="Ingrandisci">＋</button><button type="button" onclick="setZoom(zoom-.45)" aria-label="Riduci">−</button></div><div id="inventory"></div><div id="bottom"><div id="note"></div><button id="action">Continua</button></div><div id="modal"><div class="card" id="card"></div></div>
<script src="three.min.js"></script><script src="panorama-viewer.js"></script><script>
const scenes=[['La radura','01-radura.webp','Mate incontra i sette nani. Biancaneve è prigioniera oltre il Bosco Matematico.','Inizia la missione'],['Il lago incantato','02-lago.webp','La passerella deve misurare esattamente il diametro del lago. Hai diritto a una sola domanda.','Scegli la domanda'],['L’albero di Gauss','03-abete.webp','Cerca il fiore nascosto, trascinalo sulla bocca dell’abete e ascolta il suo problema.','Rispondi'],['Il muro di Talete','04-muro.webp','Le ombre possono rivelare l’altezza del muro.','Rispondi'],['La tana dei licantropi','05-tana.webp','Esplora la tana: trova la pergamena e tre ingredienti. Tocca l’inventario per rileggere la ricetta.','Apri il calderone'],['Il ponte delle pietre','06-ponte.webp','Scopri la regola e scegli le tre pietre successive.','Attraversa'],['Il portone di Biancaneve','07-castello.webp','Le cinque rune raccolte nel viaggio aprono il portone.','Apri il portone']];
const sources=[['exec-2320d075-6bbf-4316-a406-fb3386fff519.png','01-radura.webp'],['exec-6d008de7-eb95-44a7-8fbe-f339d7d8535d.png','02-lago.webp'],['exec-b0ea32f9-404a-4e2c-9de6-8302fe164413.png','03-abete.webp'],['exec-465790d1-9693-47ca-be7c-bcec9768028d.png','04-muro.webp'],['exec-e77aa670-c683-431b-8656-774cef8eaceb.png','05-tana.webp'],['exec-7c35ec59-5a11-4cbb-b454-e4bf8d5b96d0.png','06-ponte.webp'],['exec-a533c482-7c49-4025-b7ca-bfe56d4ddb52.png','07-castello.webp']];
const KEY='bosco-matematico-v1';let saved;try{saved=JSON.parse(localStorage.getItem(KEY))}catch{}let state=saved&&Number.isInteger(saved.level)?saved:{level:0,runes:[],found:[],params:{}};state.level=Math.max(0,Math.min(6,state.level));state.runes||=[];state.found||=[];state.params||={};let zoom=1;
const viewer=new PanoramaViewer('panorama-container',scenes[state.level][1],{pitchLimit:70,fov:75,minFov:30,maxFov:100,startLon:180,autoRotate:false});
viewer.onFrame=()=>drawSpots();
function render(){viewer.onFrame?.()}
function load(){viewer.setImage(scenes[state.level][1])}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function rand(a){return a[Math.floor(Math.random()*a.length)]}function params(){if(state.params[state.level])return state.params[state.level];let p;switch(state.level){case 1:{let angle=rand([12,15,20,24,30,36,40,45,60,72,90,120]);p={d:(360/angle)*rand([1,2]),angle};break}case 2:p={n:rand([99,399,599,999])};break;case 3:p={who:rand([1.2,1.5]),shadow:rand([1.2,1.5,2]),wallShadow:rand([6,8,10])};break;case 4:p={a:rand([2,3,4]),b:rand([2,3]),c:rand([3,4,5])};break;case 5:p={start:rand([2,3,4]),step:rand([2,3,4])};break;default:p={}}state.params[state.level]=p;save();return p}
const spots=[[],
 [{name:'Cartello sulla riva',x:.30,y:-.13,kind:'sign',show:()=>{if(zoom<1.65){toast('Avvicinati al cartello con ＋ o con la rotella per leggerlo.');return}modal('Cartello sulla riva',`La passerella va da un bordo all’altro, passando per il centro. La sua lunghezza è il diametro. Se conosci l’area: A = πr². Se conosci la circonferenza: C = πd. Se conosci l’arco: arco = C × angolo / 360.`)}}],
 [{name:'Fiore nascosto',x:-.95,y:-.25,show:()=>collect('fiore del bosco')},{name:'Bocca dell’abete',x:1.2,y:.06,kind:'mouth',show:()=>{if(state.found.includes('fiore del bosco'))toast('Trascina il fiore dall’inventario sulla bocca.');else toast('La bocca è serrata. Trova ciò che nasce senza essere una pigna.')}},{name:'Incisione fra le radici',x:1.6,y:-.40,show:()=>modal('Incisione',`Accoppia il primo numero con l’ultimo: 1 + N, poi 2 + (N−1). Ogni coppia ha la stessa somma.`)}],
 [{name:'Stele di Talete',x:-.6,y:-.17,show:()=>modal('Stele di Talete',`Con il Sole nella stessa posizione, altezza e ombra sono proporzionali: altezza del muro / ombra del muro = altezza del viaggiatore / sua ombra.`)}],
 [{name:'Pergamena',x:.30,y:-.19,show:()=>collect('pergamena')},{name:'Essenza di luna',x:-1.15,y:.25,show:()=>collect('luna')},{name:'Polvere d’argento',x:1.05,y:-.1,show:()=>collect('argento')},{name:'Fiore notturno',x:2.2,y:-.2,show:()=>collect('fiore')}],
 [{name:'Segni sulle pietre',x:0,y:0,show:()=>modal('Indizio',`Confronta due pietre consecutive. Quanto aumenta ogni volta?`)}],[]];
function drawSpots(){
 let root=document.querySelector('#hotspots'),list=spots[state.level];
 if(root.dataset.level!==String(state.level)||root.children.length!==list.length){root.replaceChildren();root.dataset.level=String(state.level);for(let h of list){let b=document.createElement('button');b.className='spot '+(h.kind||'');b.textContent=h.kind==='sign'?'▤':h.kind==='mouth'?'👄':'✦';b.title=h.name;b.setAttribute('aria-label',h.name);b.onclick=h.show;root.append(b)}}
 viewer.camera.updateMatrixWorld();
 list.forEach((h,i)=>{let lat=h.y,lon=Math.PI+h.x;
  let pos=new THREE.Vector3(500*Math.cos(lat)*Math.cos(lon),500*Math.sin(lat),500*Math.cos(lat)*Math.sin(lon));
  let p=pos.project(viewer.camera),el=root.children[i];
  el.style.display=p.z<0||p.z>1||Math.abs(p.x)>1.15||Math.abs(p.y)>1.15?'none':'block';
  el.style.left=(p.x+1)*50+'%';el.style.top=(1-p.y)*50+'%';
  if(!h.kind)el.textContent=state.found.includes(h.name.toLowerCase())?'✓':'✦';
 })
}
function setZoom(z){zoom=Math.max(1,Math.min(2.5,z));viewer.fov=Math.max(30,Math.min(100,75/zoom));viewer.camera.fov=viewer.fov;viewer.camera.updateProjectionMatrix();drawSpots()}
function toast(t){let el=document.querySelector('#toast');el.textContent=t;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',3400)}function modal(title,html){document.querySelector('#card').innerHTML='<h2>'+title+'</h2>'+html+'<div class="row"><button class="secondary" onclick="closeModal()">Chiudi</button></div>';document.querySelector('#modal').classList.add('open')}function closeModal(){document.querySelector('#modal').classList.remove('open')}function collect(item){if(!state.found.includes(item))state.found.push(item);save();inventory();if(item==='pergamena')recipe();else modal('Oggetto trovato','Hai raccolto: <strong>'+item+'</strong>. '+(item==='fiore del bosco'?'Trascinalo dalla borsa alla bocca dell’abete.':''));render()}
function page(){let s=scenes[state.level];document.querySelector('#scene').textContent=s[0];document.querySelector('#progress').textContent=(state.level+1)+'/7 · Rune: '+state.runes.length+'/5';document.querySelector('#note').textContent=s[2];document.querySelector('#action').textContent=s[3];params();zoom=1;document.querySelector('#resumeBtn').hidden=!(state.level===0&&state.resume>0);load();drawSpots();inventory();save()}
function next(){document.querySelector('video')?.pause();closeModal();if(state.level<6){state.level++;state.found=[];page()}else{modal('Biancaneve è libera!','Mate e i sette nani hanno attraversato il Bosco Matematico insieme. <div class="row"><button onclick="restart()">Ricomincia con nuovi numeri</button></div>')}}function home(){document.querySelector('video')?.pause();if(state.level>0)state.resume=state.level;state.level=0;page();closeModal()}function resume(){if(state.resume>0){state.level=state.resume;delete state.resume;page();closeModal()}}function restart(){if(!confirm('Ricominciare da capo con nuovi numeri?'))return;document.querySelector('video')?.pause();state={level:0,runes:[],found:[],params:{}};page();closeModal()}
function win(){const rune=['🌊','🌲','☀️','🧪','🌉'][state.level-1];state.runes.push(rune);save();modal('Prova superata!',`Avete conquistato la runa ${rune}. <div class="row"><button onclick="next()">Prosegui</button></div>`)}function fail(msg){modal('La tappa ricomincia',msg+' <p class="small">Il percorso precedente resta salvato. Potete cercare un indizio e riprovare.</p>')}
function number(id){let raw=document.getElementById(id)?.value.trim();if(!raw)return NaN;let v=Number(raw.replace(',','.'));return Number.isFinite(v)?v:NaN}function check(target,msg){let v=number('answer');if(Math.abs(v-target)<.015)win();else if(state.level===2){closeModal();pinefall();setTimeout(()=>fail('Le pigne vi hanno travolto! Riprova la somma.'),1400)}else fail(msg)}
function action(){let p=params();switch(state.level){case 0:modal('La missione comincia','<video id="intro" controls playsinline preload="metadata" style="width:100%;max-height:55vh;border-radius:12px;background:black" src="intro.mp4"></video><p>Mate e i sette nani si preparano a entrare nel Bosco Matematico.</p><div class="row"><button onclick="next()">Inizia la missione</button></div>');document.querySelector('#intro').play().catch(()=>{});break;
case 1: {let ask=state.params[1].ask;if(!ask){modal('Una sola domanda','<p>Scegli quale misura conoscere. Le altre due non saranno più disponibili.</p><div class="row"><button onclick="askLake(\'area\')">Area</button><button onclick="askLake(\'circ\')">Circonferenza</button><button onclick="askLake(\'arc\')">Arco</button></div>')}else lakeForm();break}
case 2:if(!p.awake){toast('Cerca il fiore nella scena e trascinalo sulla bocca dell’abete.');return}modal('L’albero delle pigne',`Dal ramo con ${p.n} pigne fino a quello con 1, scendendo di una pigna alla volta: quante pigne in tutto?<input id="answer" type="number" inputmode="numeric"><button onclick="check(${p.n}*(${p.n}+1)/2,'Una cascata di pigne vi riporta ai piedi dell’albero!')">Conferma</button>`);break;
case 3:modal('Il muro e le ombre',`Altezza ${p.who===1.5?'di Mate':'di un nano'}: ${p.who} m. Ombra: ${p.shadow} m. Ombra del muro: ${p.wallShadow} m. Quanto è alto il muro, in metri?<input id="answer" type="text" inputmode="decimal"><button onclick="check(${p.who*p.wallShadow/p.shadow},'La scala non raggiunge la cima: tornate a misurare le ombre.')">Conferma</button>`);break;
case 4:if(!['pergamena','luna','argento','fiore'].every(x=>state.found.includes(x))){toast('Esplora: servono la pergamena e tutti e tre gli ingredienti.');return}modal('La pozione per otto',`La pergamena dà la dose per UNA persona: ${p.a} gocce di luna, ${p.b} misure d’argento, ${p.c} petali. Inserisci le quantità per Mate e i sette nani.<label>Luna<input id="l" type="number" inputmode="numeric"></label><label>Argento<input id="a" type="number" inputmode="numeric"></label><label>Petali<input id="f" type="number" inputmode="numeric"></label><button onclick="potion()">Prepara</button>`);break;
case 5:modal('Il ponte delle pietre',`Le prime pietre riportano ${p.start}, ${p.start+p.step}, ${p.start+2*p.step}, ${p.start+3*p.step}. Digita i numeri delle TRE pietre successive, separati da virgole.<input id="seq" type="text" inputmode="text" placeholder="es. 10, 12, 14"><button onclick="bridge()">Attraversa</button>`);break;
case 6:modal('Il portone magico',`<p>«Nell’ordine del viaggio, le rune dovete disporre; dal lago al ponte il varco si può aprire.»</p><p>Rune raccolte: ${state.runes.join(' ')}</p><p>Inserisci le iniziali dei luoghi nell’ordine attraversato: Lago, Albero, Muro, Tana, Ponte.</p><input id="code" maxlength="5" autocapitalize="characters" placeholder="Cinque lettere"><button onclick="gate()">Apri</button>`);break}}
function gcd(a,b){while(b)[a,b]=[b,a%b];return a}function fraction(a,b){let g=gcd(a,b);a/=g;b/=g;return b===1?String(a):a+'/'+b}function askLake(type){let p=params();if(type==='arc')p.d=(360/p.angle)*rand([1,2]);p.ask=type;save();lakeForm()}function lakeForm(){let p=params();if(p.ask==='arc'&&(p.d*p.angle)%360!==0){p.d=360/p.angle;save()}let d=p.d;let data=p.ask==='area'?`Area = ${d*d/4}π m²`:p.ask==='circ'?`Circonferenza = ${d}π m`:`Arco di ${p.angle}° = ${d*p.angle/360}π m`;modal('La passerella',`L’unica risposta ricevuta è: <strong>${data}</strong>. Qual è la lunghezza esatta della passerella, in metri? Inserisci un numero senza π.<input id="answer" type="text" inputmode="decimal"><button onclick="lakeCheck()">Posa la passerella</button>`)}function lakeCheck(){let v=number('answer'),d=params().d;if(Math.abs(v-d)<.015)win();else fail(v<d?'La passerella è troppo corta: tutti finiscono nell’acqua del lago!':'La passerella supera la riva e conduce verso il fuoco!')}
function potion(){let p=params();if(number('l')===8*p.a&&number('a')===8*p.b&&number('f')===8*p.c)win();else fail('La pozione diventa fluorescente: i licantropi vi scoprono!')}function bridge(){let p=params(),v=document.querySelector('#seq').value.split(/[,;\s]+/).filter(Boolean).map(Number);if(v.length===3&&v.every((x,i)=>x===p.start+(i+4)*p.step))win();else fail('Una pietra si sgretola: tornate all’inizio del ponte.')}function gate(){if(document.querySelector('#code').value.trim().toUpperCase()==='LAMTP')next();else toast('Osserva l’ordine delle cinque tappe dopo la radura.')}
document.querySelector('#action').onclick=action;document.querySelector('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};page();
</script></html>
