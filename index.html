const KEY='bosco-matematico-v1';let saved;try{saved=JSON.parse(localStorage.getItem(KEY))}catch{}let state=saved&&Number.isInteger(saved.level)?saved:{level:0,runes:[],found:[],params:{}};state.level=Math.max(0,Math.min(6,state.level));state.runes||=[];state.runes=state.runes.map(x=>/^\d$/.test(String(x))?String(x):String(Math.floor(Math.random()*10)));state.found||=[];state.params||={};let zoom=1;

function save(){localStorage.setItem(KEY,JSON.stringify(state))}function rand(a){return a[Math.floor(Math.random()*a.length)]}function makeBridge(){let kind=rand(['tabellina','fibonacci','doppio']);let seq=[];if(kind==='tabellina'){let factor=rand([2,3,4,5,6,7,8,9]);seq=Array.from({length:7},(_,i)=>factor*(i+1));return {kind,factor,seq}}if(kind==='fibonacci'){seq=[1,1];while(seq.length<7)seq.push(seq.at(-1)+seq.at(-2));return {kind,seq}}let first=rand([1,2,3]);seq=[first];while(seq.length<7)seq.push(2*seq.at(-1)+1);return {kind,seq}}
function params(){if(state.level===2&&state.params[2]&&![200,400,600,1000].includes(state.params[2].n))state.params[2]={n:rand([200,400,600,1000])};if(state.level===5&&state.params[5]&&(!state.params[5].seq||(state.params[5].kind==='fibonacci'&&String(state.params[5].seq.slice(0,2))!=='1,1')))delete state.params[5];if(state.params[state.level])return state.params[state.level];let p;switch(state.level){case 1:{let angle=rand([12,15,20,24,30,36,40,45,60,72,90,120]);p={d:(360/angle)*rand([1,2]),angle};break}case 2:p={n:rand([200,400,600,1000])};break;case 3:p={who:rand([1.2,1.5]),shadow:rand([1.2,1.5,2]),wallShadow:rand([6,8,10])};break;case 4:p={a:rand([2,3,4]),b:rand([2,3]),c:rand([3,4,5])};break;case 5:p=makeBridge();break;default:p={}}state.params[state.level]=p;save();return p}

factSpot(2,'Pigne sull’abete',.34,.14,'Le spirali delle pigne','Su molte pigne le scaglie formano spirali in due direzioni. Contandole, si trovano spesso numeri consecutivi della successione di Fibonacci. È una struttura naturale frequente, non una regola che vale per ogni pigna.');
factSpot(2,'Ruscello presso l’abete',.15,.67,'Il fiume di Eraclito','Eraclito usava il fiume per parlare del divenire: l’acqua cambia continuamente, anche se chiamiamo il ruscello sempre con lo stesso nome. Quali cambiamenti noti nella natura intorno all’abete?');
factSpot(2,'Scoiattolo',.59,.29,'Lo scoiattolo e i semi','Gli scoiattoli possono nascondere semi e frutti per recuperarli in seguito. Quelli dimenticati talvolta germogliano: anche un piccolo animale può contribuire alla diffusione delle piante.');
factSpot(2,'Picchio',.45,.25,'Il picchio','Il picchio percuote il legno anche per cercare insetti e per scavare cavità. Il suo becco e il suo corpo sono adattati a questa attività. Riesci a trovarlo tra i rami?');
factSpot(2,'Grande rapace',.895,.19,'Il rapace nel cielo','Questo grande uccello ricorda un’aquila, ma il disegno non permette di riconoscerne la specie. I rapaci possono sfruttare correnti d’aria ascendenti per planare consumando meno energia.');
factSpot(2,'Nuvole sulle vette',.83,.31,'Nuvole di montagna','Quando aria umida incontra una montagna, può essere spinta verso l’alto. Salendo si raffredda e il vapore può condensare in minuscole gocce: così si formano spesso nubi vicino alle vette.',true);
factSpot(3,'Ruota del carro',.91,.67,'La ruota e la circonferenza','Misura il raggio dal centro al bordo della ruota. Il giro completo misura C = 2πr. Se il raggio raddoppia, che cosa succede alla distanza percorsa dalla ruota in un giro?');
factSpot(3,'Ulivo presso il muro',.08,.28,'L’ulivo','L’ulivo è una pianta tipica dei paesaggi mediterranei. Le foglie strette e coriacee aiutano a limitare la perdita d’acqua durante i periodi caldi e asciutti.');
factSpot(4,'Stalattiti della grotta',.52,.10,'Le stalattiti','Le stalattiti pendono dal soffitto. L’acqua che filtra nella roccia può lasciare minuscoli depositi minerali, goccia dopo goccia. Le stalagmiti, invece, crescono dal pavimento.');
factSpot(4,'Figura del lupo mannaro',.965,.25,'Il lupo mannaro','Il lupo mannaro, o licantropo, è una creatura delle leggende: una persona che si trasforma in lupo, spesso nelle notti di luna piena. Appartiene alla fantasia; i lupi reali sono animali e non si trasformano.');
factSpot(4,'Resti scheletrici',.10,.70,'Di chi sono queste ossa?','Nel racconto potrebbero appartenere a una creatura scomparsa. Per riconoscere davvero una specie estinta servono fossili studiati dagli esperti: dalla sola immagine non possiamo dire che sia un dinosauro. Quali particolari delle ossa osserveresti?',true);

function drawSpots(){
 let root=document.querySelector('#hotspots'),list=spots[state.level];
 if(root.dataset.level!==String(state.level)||root.children.length!==list.length){root.replaceChildren();root.dataset.level=String(state.level);for(let h of list){let b=document.createElement('button');b.className='spot '+(h.kind||'');b.innerHTML=h.kind==='sign'?'<span class="sign-title">PER ATTRAVERSARE IL LAGO</span><span class="sign-copy">Serve una passerella da bordo a bordo, attraverso il centro.</span><span class="sign-cta">Scegli la domanda →</span>':((h.kind||'').includes('hidden')||(h.kind||'').includes('fact'))?'':h.kind==='mouth'||h.kind==='flower'?'':(h.kind||'').includes('mission')?'✧':h.kind==='bridge-hint'?'?':'✦';if(h.kind==='flower')b.onpointerdown=flowerDrag;b.dataset.label=h.name;b.title=h.name;b.setAttribute('aria-label',h.name);b.onclick=h.show;root.append(b)}}
 viewer.camera.updateMatrixWorld();
 list.forEach((h,i)=>{let lat=h.y,lon=Math.PI+h.x;
  let pos=new THREE.Vector3(500*Math.cos(lat)*Math.cos(lon),500*Math.sin(lat),500*Math.cos(lat)*Math.sin(lon));
  let p=pos.project(viewer.camera),el=root.children[i];
  el.style.display=p.z<0||p.z>1||Math.abs(p.x)>1.15||Math.abs(p.y)>1.15?'none':(h.kind==='sign'||(h.kind||'').includes('door'))?'flex':'block';if(h.kind==='sign')el.style.setProperty('--sign-scale',Math.max(.82,Math.min(1.65,75/viewer.fov)).toFixed(2));if(h.kind==='recipe-mark'){let q=params(),label=`📜 UNA DOSE<br>${q.a} luna · ${q.b} argento · ${q.c} petali`;if(el.innerHTML!==label)el.innerHTML=label}if((h.kind||'').includes('door')){let label=viewer.fov<=60?'<strong>LA SCALA DELLE OMBRE</strong><small>Quanto dev’essere alta?</small><em>Leggi la missione →</em>':'<strong>✧ ISCRIZIONE</strong><small>Ingrandisci il portone</small>';if(el.innerHTML!==label)el.innerHTML=label}
  el.style.left=(p.x+1)*50+'%';el.style.top=(1-p.y)*50+'%';
  if(!h.kind)el.textContent=state.found.includes(h.name.toLowerCase())?'✓':'✦';
 })
}
function drawStoneOverlay(){let root=document.querySelector('#stoneOverlay');root.replaceChildren();root.hidden=state.level!==5;if(state.level!==5)return;let seq=params().seq;seq.slice(0,5).forEach((n,i)=>{let el=document.createElement('span');el.textContent=i===2?'?':n;if(i===2)el.className='missing';root.append(el)})}
function toggleExplore(){let active=document.body.classList.toggle('show-facts');let btn=document.querySelector('#exploreBtn');btn.textContent=active?'✦ Curiosità':'◇ Mostra curiosità';btn.setAttribute('aria-pressed',String(active))}
function setZoom(z){zoom=Math.max(1,Math.min(2.5,z));viewer.fov=Math.max(30,Math.min(100,75/zoom));viewer.camera.fov=viewer.fov;viewer.camera.updateProjectionMatrix();drawSpots()}
function inventory(){let root=document.querySelector('#inventory');root.replaceChildren();for(let item of state.found){let b=document.createElement('button');b.textContent=item==='fiore del bosco'?'🌼 Margherita':item==='pergamena'?'📜 Ricetta':item==='luna'?'🌙 Luna':item==='argento'?'🥈 Argento':'🌸 Fiore';b.onclick=()=>item==='pergamena'?recipe():item==='fiore del bosco'?carryFlower():toast('Ingrediente raccolto: '+item);if(item==='fiore del bosco')b.onpointerdown=flowerDrag;root.append(b)}document.querySelector('#carry').hidden=!(state.level===2&&state.carried&&!params().awake)}
function carryFlower(){if(state.level!==2)return;state.carried=true;save();inventory();toast('Margherita in mano: ruota il panorama, trova la bocca e toccala. Puoi procedere un po’ per volta.')}
function awakenTree(){if(!state.found.includes('fiore del bosco'))state.found.push('fiore del bosco');state.carried=false;state.params[2].awake=true;save();inventory();modal('Il bacio della margherita',`L’abete sfiora con un bacio la sua margherita e finalmente parla: «Sul primo ramo ho ${params().n} pigne; sul secondo ${params().n-1}, e così via fino all’ultimo ramo con una sola pigna. Quante pigne ho in tutto?» <div class="row"><button onclick="closeModal();action()">Rispondi</button></div>`)}
function flowerDrag(e){if(state.level!==2)return;e.stopPropagation();let startX=e.clientX,startY=e.clientY,ghost=null,moved=false;
 const move=q=>{if(!moved&&Math.hypot(q.clientX-startX,q.clientY-startY)>9){moved=true;ghost=document.createElement('div');ghost.className='dragging';ghost.textContent='🌼';document.body.append(ghost)}if(ghost){ghost.style.left=q.clientX+'px';ghost.style.top=q.clientY+'px'}},up=q=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);if(!moved)return;ghost?.remove();let target=document.elementFromPoint(q.clientX,q.clientY);if(target?.closest('.spot.mouth'))awakenTree();else{if(!state.found.includes('fiore del bosco'))state.found.push('fiore del bosco');state.carried=true;save();inventory();toast('Margherita in mano: gira la scena e tocca la bocca quando la trovi.')}};
 document.addEventListener('pointermove',move);document.addEventListener('pointerup',up,{once:true})}
function doseText(p){return `${p.a} gocce di luna, ${p.b} misure d’argento e ${p.c} petali del fiore notturno`}function recipe(){let p=params();modal('La pergamena dell’invisibilità',`<p>Per sfuggire ai lupi mannari sotto la luna piena, <strong>ogni persona</strong> dovrà assumere una dose della pozione dell’invisibilità: <strong>${doseText(p)}.</strong></p><p>Prepara in una sola volta la quantità necessaria per tutti e otto: dopo ogni preparazione il calderone è inutilizzabile per 12 ore.</p><p>Ingredienti trovati: ${state.found.filter(x=>['luna','argento','fiore'].includes(x)).length} su 3.</p>`)}
function pinefall(){let el=document.querySelector('#effects'),stage=document.querySelector('#panorama-container');el.replaceChildren();stage.classList.add('shake');for(let i=0;i<42;i++){let a=document.createElement('span');a.className='fall';a.textContent='🌰';a.style.left=Math.random()*100+'%';a.style.animationDelay=Math.random()*.65+'s';a.style.setProperty('--dx',(Math.random()-.5)*200+'px');el.append(a)}setTimeout(()=>{el.replaceChildren();stage.classList.remove('shake')},2300)}
function toast(t){let el=document.querySelector('#toast');el.textContent=t;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',3400)}function modal(title,html){document.querySelector('#modal').classList.remove('intro');document.querySelector('#card').innerHTML='<h2>'+title+'</h2>'+html+'<div class="row"><button class="secondary" onclick="closeModal()">Chiudi</button></div>';document.querySelector('#modal').classList.add('open')}function closeModal(){document.querySelector('#modal').classList.remove('open','intro')}function collect(item){if(!state.found.includes(item))state.found.push(item);if(item==='fiore del bosco')state.carried=true;save();inventory();if(item==='pergamena')recipe();else modal('Oggetto trovato','Hai raccolto: <strong>'+ (item==='fiore del bosco'?'la margherita':item)+'</strong>. '+(item==='fiore del bosco'?'Ora resta in mano: ruota il panorama liberamente e tocca la bocca dell’abete per il suo bacio.':''));render()}
function page(){document.body.classList.add('show-facts');document.querySelector('#exploreBtn').setAttribute('aria-pressed','true');document.querySelector('#exploreBtn').textContent='✦ Curiosità';let s=scenes[state.level];document.querySelector('#scene').textContent=s[0];document.querySelector('#progress').textContent=(state.level+1)+'/7 · Rune: '+state.runes.length+'/5';document.querySelector('#note').textContent=s[2];document.querySelector('#action').textContent=s[3];document.querySelector('#action').hidden=[1,3,6].includes(state.level);params();zoom=1;document.querySelector('#resumeBtn').hidden=!(state.level===0&&state.resume>0);load();drawSpots();drawStoneOverlay();inventory();save()}
function next(){document.querySelector('video')?.pause();closeModal();if(state.level<6){state.level++;state.found=[];page()}else{modal('Biancaneve è libera!','Mate e i sette nani hanno attraversato il Bosco Matematico insieme. <div class="row"><button onclick="restart()">Ricomincia con nuovi numeri</button></div>')}}function home(){document.querySelector('video')?.pause();if(state.level>0)state.resume=state.level;state.level=0;page();closeModal()}function resume(){if(state.resume>0){state.level=state.resume;delete state.resume;page();closeModal()}}function restart(){if(!confirm('Ricominciare da capo con nuovi numeri?'))return;document.querySelector('video')?.pause();state={level:0,runes:[],found:[],params:{}};document.querySelector('#victory').classList.remove('open');page();closeModal()}
function win(){const digit=String(Math.floor(Math.random()*10));state.runes.push(digit);save();modal('Prova superata!',`<p>La ${['prima','seconda','terza','quarta','quinta'][state.level-1]} runa rivela una cifra:</p><div class="rune-digit">${digit}</div><p>Annotala: servirà per aprire il portone, insieme alle altre quattro, nell’ordine del viaggio.</p><div class="row"><button onclick="next()">Prosegui</button></div>`)}function rollback(msg){let failed=state.level,previous=Math.max(0,failed-1);const old=JSON.stringify(state.params[previous]);delete state.params[failed];delete state.params[previous];state.level=previous;state.runes=state.runes.slice(0,Math.max(0,previous-1));state.found=[];state.carried=false;delete state.resume;page();if(previous>0){for(let tries=0;tries<12&&JSON.stringify(state.params[previous])===old;tries++){delete state.params[previous];params()}drawStoneOverlay();save()}modal('Torna alla tappa precedente',`${msg}<p class="small">La prova precedente è cambiata: osserva la scena e risolvila con i nuovi numeri.</p>`)}
function fail(msg){rollback(msg)}
function number(id){let raw=document.getElementById(id)?.value.trim();if(!raw)return NaN;let v=Number(raw.replace(',','.'));return Number.isFinite(v)?v:NaN}function check(target,msg){let v=number('answer');if(Math.abs(v-target)<.015)win();else if(state.level===2){closeModal();pinefall();setTimeout(()=>fail('Le pigne vi hanno travolto e riportato al lago.'),2000)}else fail(msg)}
function action(){let p=params();switch(state.level){case 0:modal('La missione comincia','<video id="intro" controls playsinline preload="metadata" style="width:100%;max-height:55vh;border-radius:12px;background:black" src="intro.mp4"></video><p>Mate e i sette nani si preparano a entrare nel Bosco Matematico.</p><div class="row"><button onclick="next()">Inizia la missione</button></div>');document.querySelector('#modal').classList.add('intro');document.querySelector('#intro').play().catch(()=>{});break;
case 1:readLakeSign();break;
case 2:if(!p.awake){toast('Raccogli la margherita, ruota la scena e tocca la bocca dell’abete per il bacio.');return}modal('L’albero delle pigne',`Dal ramo con ${p.n} pigne fino a quello con 1, scendendo di una pigna alla volta: quante pigne in tutto?<input id="answer" type="number" inputmode="numeric"><button onclick="check(${p.n}*(${p.n}+1)/2,'Una cascata di pigne vi riporta ai piedi dell’albero!')">Conferma</button>`);break;
case 3:if(!p.seen){wallMission();return}modal('Il muro e le ombre',`Altezza ${p.who===1.5?'di Mate':'di un nano'}: ${p.who} m. Ombra: ${p.shadow} m. Ombra del muro: ${p.wallShadow} m. Quanto è alto il muro, in metri?<input id="answer" type="text" inputmode="decimal"><button onclick="check(${p.who*p.wallShadow/p.shadow},'La scala non raggiunge la cima: tornate a misurare le ombre.')">Conferma</button>`);break;
case 4:if(!['pergamena','luna','argento','fiore'].every(x=>state.found.includes(x))){toast('Esplora: servono la pergamena e tutti e tre gli ingredienti.');return}modal('La pozione per otto',`Dalla pergamena: una dose contiene ${doseText(p)}. Il calderone funziona una sola volta: inserisci le quantità complessive per Mate e i sette nani.<label>Luna<input id="l" type="number" inputmode="numeric"></label><label>Argento<input id="a" type="number" inputmode="numeric"></label><label>Petali<input id="f" type="number" inputmode="numeric"></label><button onclick="potion()">Prepara</button>`);break;
case 5:modal('Il ponte delle pietre',`Il burrone separa il gruppo dal castello. Osserva le cinque pietre numerate nella scena: una cifra è coperta. Scopri la regola e scrivi nell’ordine i numeri della terza, sesta e settima pietra.<p class="fact-summary">${p.seq.slice(0,2).join(' · ')} · ? · ${p.seq.slice(3,5).join(' · ')} · ? · ?</p><input id="seq" type="text" inputmode="text" placeholder="Es. 27-54-63, oppure con virgole"><button onclick="bridge()">Attraversa</button>`);break;
case 6:gateMission();break}}
function readLakeSign(){let p=params();modal('Il cartello sulla riva',`<p>Per raggiungere il sentiero sull’altra riva, la passerella deve andare esattamente da un bordo all’altro del lago circolare, passando per il centro. Se è troppo corta, cadrete nell’acqua; se è troppo lunga, arriverete alla sponda infuocata.</p><p>Potete fare <strong>una sola domanda</strong> per trovare la lunghezza giusta.</p><div class="row"><button onclick="chooseLakeQuestion()">${p.ask?'Rivedi la misura scelta':'Scegli la domanda'}</button></div>`)}function chooseLakeQuestion(){let p=params();if(p.ask){lakeForm();return}modal('Quale misura vuoi conoscere?','<p>Puoi chiedere soltanto una di queste tre misure.</p><div class="row"><button onclick="askLake(\'area\')">Area del lago</button><button onclick="askLake(\'circ\')">Circonferenza</button><button onclick="askLake(\'arc\')">Lunghezza di un arco</button></div>')}function gcd(a,b){while(b)[a,b]=[b,a%b];return a}function fraction(a,b){let g=gcd(a,b);a/=g;b/=g;return b===1?String(a):a+'/'+b}function askLake(type){let p=params();if(type==='arc')p.d=(360/p.angle)*rand([1,2]);p.ask=type;save();lakeForm()}function lakeForm(){let p=params();if(p.ask==='arc'&&(p.d*p.angle)%360!==0){p.d=360/p.angle;save()}let d=p.d;let data=p.ask==='area'?`Area = ${d*d/4}π m²`:p.ask==='circ'?`Circonferenza = ${d}π m`:`Arco di ${p.angle}° = ${d*p.angle/360}π m`;modal('La passerella',`L’unica risposta ricevuta è: <strong>${data}</strong>. Qual è la lunghezza esatta della passerella, in metri? Inserisci la lunghezza in metri.<input id="answer" type="text" inputmode="decimal"><button onclick="lakeCheck()">Posa la passerella</button>`)}function lakeCheck(){let v=number('answer'),d=params().d;if(!Number.isFinite(v)){toast('Inserisci una lunghezza in metri.');return}if(Math.abs(v-d)<.015){win();return}closeModal();lakeAccident(v<d?'water':'fire')}
function lakeAccident(kind){let stage=document.querySelector('#effects');stage.replaceChildren();stage.className=kind==='water'?'water-event':'fire-event';let label=document.createElement('div');label.className='event-label';label.textContent=kind==='water'?'SPLASH! La passerella è troppo corta!':'La passerella porta alla riva infuocata!';stage.append(label);for(let i=0;i<36;i++){let part=document.createElement('span');part.className=kind==='water'?'water-drop':'fire-flame';part.style.left=(Math.random()*100)+'%';part.style.setProperty('--delay',(Math.random()*.8)+'s');part.style.setProperty('--shift',((Math.random()-.5)*240)+'px');part.style.setProperty('--size',(22+Math.random()*60)+'px');part.textContent=kind==='water'?'💦':'🔥';stage.append(part)}setTimeout(()=>{stage.replaceChildren();stage.className='';rollback(kind==='water'?'Un grande spruzzo vi ha riportati alla radura.':'Le fiamme vi hanno costretti a tornare alla radura.')},4500)}
function potion(){let p=params();if(number('l')===8*p.a&&number('a')===8*p.b&&number('f')===8*p.c)win();else fail('La pozione diventa fluorescente: i licantropi vi scoprono!')}function parseBridgeNumbers(raw){let parts=raw.trim().split(/[,;\s\-–—]+/).filter(Boolean);return parts.length===3&&parts.every(x=>/^\d+$/.test(x))?parts.map(Number):null}function bridge(){let p=params(),v=parseBridgeNumbers(document.querySelector('#seq').value);if(!v){toast('Scrivi tre numeri separati da trattini, virgole o spazi.');return}if(v.every((x,i)=>x===p.seq[[2,5,6][i]]))win();else fail('Una pietra si sgretola: tornate all’inizio del ponte.')}function wallMission(){if(viewer.fov>60){toast('Ingrandisci il portone con ＋, poi tocca l’iscrizione.');return}params().seen=true;save();let p=params();modal('L’iscrizione sul portone',`<p>«Al di là del muro passa soltanto chi sa costruire la scala giusta. Troppo corta: cadrai; troppo lunga: tornerai indietro.»</p><p>Quanto deve essere alta la scala? ${p.who===1.5?'Mate è alta 1,50 m':'Un nano è alto 1,20 m'} e la sua ombra misura ${p.shadow} m. L’ombra del muro misura ${p.wallShadow} m. Cerca indizi nelle ombre del pozzo e della panchina.</p><div class="row"><button onclick="action()">Calcola la scala</button></div>`)}
function wallFailure(){rollback('La scala cede: tornate all’abete.')}
function potionMission(){modal('La tana sotto la luna piena',`<p>Fuori risuonano gli ululati: i lupi mannari stanno arrivando. Solo la pozione dell’invisibilità potrà far passare Mate e i sette nani senza essere visti.</p><p>Trova la pergamena accanto alla candela, l’essenza sulla luna, l’argento fra i gioielli e i petali sui fiori celesti. Poi prepara tutte e otto le dosi nel calderone.</p><div class="row"><button onclick="closeModal();action()">Prepara la pozione</button></div>`)}
function bridgeHint(){let p=params();let hint=p.kind==='tabellina'?`La sequenza segue una tabellina: osserva la distanza tra le pietre che conosci.`:p.kind==='fibonacci'?`Questa è la successione di Fibonacci: ogni numero è la somma dei due precedenti.`:`Ogni numero è il doppio del precedente, più 1.`;modal('Indizio sulla regola',`<p>${hint}</p>`)}
function bridgeMission(){let p=params();modal('La missione del burrone',`<p>Davanti a voi, il ponte è scomparso. Osservate le cinque pietre che appaiono nella scena: una nasconde il proprio numero. Completate la successione per raggiungere il castello. Il punto interrogativo sulle pietre offre un indizio sulla regola.</p><p class="fact-summary">${p.seq.slice(0,2).join(' · ')} · ? · ${p.seq.slice(3,5).join(' · ')} · ? · ?</p><div class="row"><button onclick="action()">Scegli le pietre</button></div>`)}
function gateMission(){modal('La serratura del portone',`<p>«Cinque prove, cinque cifre. Nell’ordine in cui le avete vinte, componetele: soltanto così Biancaneve sarà libera.»</p><p>Le cifre annotate durante il viaggio sono: <strong>${state.runes.join(' · ')||'nessuna'}</strong></p><input id="code" type="text" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="Codice di cinque cifre"><button onclick="gate()">Apri il portone</button>`)}
function gate(){let v=document.querySelector('#code')?.value.trim();if(state.runes.length===5&&/^\d{5}$/.test(v)&&v===state.runes.join('')){state.completed=true;save();victory()}else rollback('Il portone non si apre: tornate al ponte delle pietre.');}
function victory(){closeModal();document.querySelector('#victory').classList.add('open')}
document.querySelector('#action').onclick=action;document.querySelector('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};page();
</script></html>
